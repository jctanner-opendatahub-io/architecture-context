---
version: 1

# Base sandbox policy for the arch-context harness.
# Modeled on fullsend-ai/agents policies/base.yaml: non-composable
# sandbox restrictions (filesystem, landlock, process identity).
# Network access is provided entirely by provider profiles via
# provider-backed policy composition (ADR 0065) — none declared here
# because the workflow reads only pre-uploaded local checkouts.
#
# Note: model API egress for real-model children comes from the
# harness's provider configuration at run time (inference gateway or
# Vertex per the port plan §5.3), never from this policy.

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
